[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmri"
version = "0.1.8"
description = "Offline malicious Agent Skill scanner with contract audit and canary sandbox probes"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "agent-knowledge contributors" }]
dependencies = []

[project.scripts]
skillmri = "skillmri.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillmri*"]
