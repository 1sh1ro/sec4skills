name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-image.yml
      - Dockerfile
      - engine/**
      - pyproject.toml
      - skillmri/**

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/sec4skills:latest \
            -t ghcr.io/${{ github.repository_owner }}/sec4skills:contest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/sec4skills:latest
          docker push ghcr.io/${{ github.repository_owner }}/sec4skills:contest
